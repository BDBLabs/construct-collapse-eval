[project]
name = "construct-collapse"
version = "0.1.0"
description = "Synthetic selective-answering simulation for construct collapse in scalar preference evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construct_collapse"]
